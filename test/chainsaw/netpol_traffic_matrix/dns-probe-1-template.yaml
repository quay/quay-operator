apiVersion: batch/v1
kind: Job
metadata:
  name: ${NAME}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        quay-component: ${COMPONENT}
        quay-operator/quayregistry: ${REG}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: probe
        image: busybox:stable
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command:
        - sh
        - -c
        - |
          nc -z -w 5 ${HOST} ${PORT} \
            && echo "PASS: ${COMPONENT} reached ${HOST}:${PORT}" \
            || { echo "FAIL: ${COMPONENT} could not reach ${HOST}:${PORT}"; exit 1; }
