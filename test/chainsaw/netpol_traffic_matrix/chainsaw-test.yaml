# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: netpol-traffic-matrix
spec:
  concurrent: false
  steps:
  - name: create-registry
    try:
    - script:
        content: |
          # This test is OpenShift-only (excluded from KinD in the Makefile): it runs
          # the full managed component set — including Clair — which is too heavy for
          # KinD. On OpenShift object storage is operator-managed (managedObjectStorage:
          # true, configBundle: ""), so no config bundle needs to be created here.
          if kubectl api-resources 2>/dev/null | grep -q route.openshift.io; then
            echo "OpenShift detected: object storage is managed, no config bundle needed"
            exit 0
          fi
          echo "OpenShift-only test (excluded from KinD): no unmanaged-storage bundle created"
    - apply:
        file: 00-create-quay-registry.yaml
    - script:
        shell: /bin/bash
        content: |
          set -euo pipefail

          wait_for_deployment() {
            local name="$1"
            echo "Waiting for ${name} to be created by the operator..."
            for i in $(seq 1 60); do
              kubectl get deployment "${name}" -n $NAMESPACE &>/dev/null && break
              [ "$i" -eq 60 ] && { echo "ERROR: ${name} not created in time"; exit 1; }
              sleep 5
            done
            echo "Waiting for ${name} to roll out..."
            kubectl rollout status deployment/"${name}" -n $NAMESPACE --timeout=300s
          }

          wait_for_deployment netpol-matrix-quay-database
          wait_for_deployment netpol-matrix-quay-redis
          wait_for_deployment netpol-matrix-clair-postgres

  - name: positive-controls
    try:
    - script:
        shell: /bin/bash
        content: |
          set -euo pipefail
          export REG="netpol-matrix"
          NS="$NAMESPACE"
          TEMPLATE_FILE=dns-probe-1-template.yaml

          # busybox runs as root by default. On KinD/plain Kubernetes there is no SCC
          # to assign a non-root UID, so we must pin one to satisfy runAsNonRoot. On
          # OpenShift the restricted SCC assigns a UID from the namespace range and a
          # hard-coded runAsUser: 1000 would fail SCC admission — so leave it unset there.
          if kubectl api-resources 2>/dev/null | grep -q route.openshift.io; then
            export RUN_AS_USER=""
          else
            export RUN_AS_USER=1000
          fi

          # Helper: create a probe Job that must successfully connect to host:port.
          # The pod carries src_component + quay-operator/quayregistry labels so the
          # matching allow policy grants it the required egress and the target's ingress
          # policy recognises it as an authorised peer.
          create_allow_probe() {
            export NAME="$1" 
            export HOST="$2" 
            export PORT="$3" 
            export COMPONENT="$4"

            # since we don't have envsubst available in Prow, use python3 to expand
            # env. variables
            python3 -c "import string, os; print(string.Template(open('${TEMPLATE_FILE}').read()).safe_substitute(os.environ));" \
              | kubectl apply -f - -n $NAMESPACE
          }

          create_allow_probe "probe-quayapp-postgres"    "${REG}-quay-database"  5432 quay-app
          create_allow_probe "probe-quayapp-redis"       "${REG}-quay-redis"     6379 quay-app
          create_allow_probe "probe-mirror-postgres"     "${REG}-quay-database"  5432 quay-mirror
          create_allow_probe "probe-mirror-redis"        "${REG}-quay-redis"     6379 quay-mirror
          create_allow_probe "probe-upgrade-postgres"    "${REG}-quay-database"  5432 quay-app-upgrade
          create_allow_probe "probe-upgrade-redis"       "${REG}-quay-redis"     6379 quay-app-upgrade
          create_allow_probe "probe-clair-clairpostgres" "${REG}-clair-postgres" 5432 clair-app

          # quay-app → clair is conditional: skip on KinD where clair may not be configured
          if kubectl rollout status deployment/${REG}-clair-app -n ${NS} --timeout=60s 2>/dev/null; then
            create_allow_probe "probe-quayapp-clair-8080" "${REG}-clair-app" 8080 quay-app
            create_allow_probe "probe-quayapp-clair-8089" "${REG}-clair-app" 8089 quay-app
            CLAIR_JOBS="probe-quayapp-clair-8080 probe-quayapp-clair-8089"
          else
            echo "Clair not available; skipping clair ingress positive probes"
            CLAIR_JOBS=""
          fi

          echo "Waiting for positive-control jobs to complete (allow expected)..."
          for job in probe-quayapp-postgres probe-quayapp-redis \
                     probe-mirror-postgres probe-mirror-redis \
                     probe-upgrade-postgres probe-upgrade-redis \
                     probe-clair-clairpostgres ${CLAIR_JOBS}; do
            kubectl wait job/${job} -n ${NS} --for=condition=complete --timeout=90s \
              || {
                echo "FAIL: ${job} did not complete (connection unexpectedly denied)"
                kubectl logs job/${job} -n ${NS} 2>/dev/null || true
                exit 1
              }
            echo "PASS: ${job}"
          done

  - name: negative-controls
    try:
    - script:
        shell: /bin/bash
        content: |
          set -euo pipefail
          REG="netpol-matrix"
          NS="$NAMESPACE"
          TEMPLATE_FILE=dns-probe-2-template.yaml

          # busybox runs as root by default. On KinD/plain Kubernetes there is no SCC
          # to assign a non-root UID, so we must pin one to satisfy runAsNonRoot. On
          # OpenShift the restricted SCC assigns a UID from the namespace range and a
          # hard-coded runAsUser: 1000 would fail SCC admission — so leave it unset there.
          if kubectl api-resources 2>/dev/null | grep -q route.openshift.io; then
            export RUN_AS_USER=""
          else
            export RUN_AS_USER=1000
          fi

          # Untrusted probe: carries NO quay-component or quay-operator/quayregistry labels.
          # With no label the default-deny-all policy does not select it, so the pod has
          # free egress. However, each target's ingress NetworkPolicy only admits pods
          # carrying specific (quay-component, quay-operator/quayregistry) label pairs —
          # the untrusted probe is rejected by the target's ingress rule.
          create_deny_probe() {
            export NAME="$1" 
            export HOST="$2" 
            export PORT="$3"

            # since we don't have envsubst available in Prow, use python3 to expand
            # env. variables
            python3 -c "import string, os; print(string.Template(open('${TEMPLATE_FILE}').read()).safe_substitute(os.environ));" \
              | kubectl apply -f - -n $NAMESPACE   
          }

          create_deny_probe "probe-deny-postgres"    "${REG}-quay-database"  5432
          create_deny_probe "probe-deny-redis"       "${REG}-quay-redis"     6379
          create_deny_probe "probe-deny-clairpg"     "${REG}-clair-postgres" 5432
          create_deny_probe "probe-deny-clair-8080"  "${REG}-clair-app"      8080
          create_deny_probe "probe-deny-clair-8089"  "${REG}-clair-app"      8089

          echo "Waiting for negative-control jobs to complete (deny expected)..."
          for job in probe-deny-postgres probe-deny-redis probe-deny-clairpg \
                     probe-deny-clair-8080 probe-deny-clair-8089; do
            kubectl wait job/${job} -n ${NS} --for=condition=complete --timeout=90s \
              || {
                echo "FAIL: ${job} did not complete (ingress policy may be too permissive)"
                kubectl logs job/${job} -n ${NS} 2>/dev/null || true
                exit 1
              }
            echo "PASS: ${job}"
          done
