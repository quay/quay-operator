---
updates:
  - file: "manifests/quay-operator.clusterserviceversion.yaml"
    update_list:
      - search: "olm.skipRange: \">=3.5.x <3.6.1\""
        replace: "olm.skipRange: \">=3.8.x <3.9.28\""
      - search: "quay-version: v3.6.1"
        replace: "quay-version: v3.9.28"
      - search: "name: quay-operator.v3.6.1"
        replace: "name: quay-operator.v3.9.28"
      - search: "version: 3.6.1"
        replace: "version: 3.9.28"
external-images:
  - search: "quay.io/sclorg/postgresql-13-c9s:latest"
    replace: "registry.redhat.io/rhel8/postgresql-13:latest"
  - search: "centos/postgresql-10-centos7:latest"
    replace: "registry.redhat.io/rhel8/postgresql-10:latest"
  - search: "docker.io/library/redis:7.0"
    replace: "registry.redhat.io/rhel8/redis-6:latest"
